name: Build Android Debug APK (manual)

on:
  workflow_dispatch: {}
  push:
    branches: [ "ci/build-apk-run" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Find project dir with gradlew and build APK
        run: |
          set -e
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file poore repo me nahi mila."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Using project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

          mkdir -p $GITHUB_WORKSPACE/output-apk
          cp -v app/build/outputs/apk/debug/*.apk $GITHUB_WORKSPACE/output-apk/ 2>/dev/null || true
          find . -type f -path "*/build/outputs/apk/*/debug/*.apk" -exec cp -v {} $GITHUB_WORKSPACE/output-apk/ \; || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output-apk/
