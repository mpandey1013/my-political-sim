name: Android Kotlin APK Build

on:
  push:
    branches: [ "feature/diplomacy-engine" ]
  pull_request:
    branches: [ "feature/diplomacy-engine" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Specific Branch
        uses: actions/checkout@v4
        with:
          ref: feature/diplomacy-engine

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Automatic Folder Search and Build APK
        run: |
          # Yeh command khud dhoond legi ki gradlew file kis folder me hai
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file poore project me kahin nahi mili!"
            exit 1
          fi
          
          # Jis folder me gradlew mili, uske andar jana
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          echo "Project folder mil gaya: $PROJECT_DIR"
          
          # Permission dena aur APK build karna
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
          # Banaye gaye APK ko root folder me copy karna taaki upload ho sake
          mkdir -p $GITHUB_WORKSPACE/output-apk
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output-apk/ || cp */build/outputs/apk/debug/*.apk $GITHUB_WORKSPACE/output-apk/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output-apk/
          
